<div
  style="
    font-family: -apple-system, &quot;Segoe UI&quot;, Roboto, Arial, sans-serif;
    color: #111;
    max-width: 560px;
    margin: 0 auto;
  "
>
  <h2 style="font-size: 20px; margin: 0 0 4px">{{subject}}</h2>
  <p style="margin: 0 0 16px; font-size: 13px; color: #666">{{subtitle}}</p>
  <ul style="margin: 0 0 20px; padding-left: 0; list-style: none">
    {{lines}}
  </ul>
  <p style="font-size: 12px; color: #666; margin: 0 0 12px">{{hash}}</p>
  <p style="font-size: 12px; color: #999; margin: 0">
    You're getting this because {{tracked}} is on your watch list.
  </p>
  <p style="font-size: 12px; margin: 12px 0 0">
    <a href="{{manageUrl}}" style="color: #1a0dab">Manage your accounts</a>
  </p>
</div>
